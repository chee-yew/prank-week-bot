name = "prank-week-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Serve at https://prank-week-bot.chee-yew.workers.dev
# (yours will be https://<name>.<your-subdomain>.workers.dev)
workers_dev = true
# No per-version preview URLs: only the live deployment should receive webhooks.
preview_urls = false

# Every minute: deliver queued /broadcast messages in small batches
# (the free plan caps outgoing requests per invocation at 50).
[triggers]
crons = ["* * * * *"]

[vars]
# Shown at the top of the bot's help message, e.g. "🃏 Prank Week bot".
EVENT_NAME = "Prank Week"

# Admins are NOT configured here. ADMIN_IDS (comma-separated Telegram user IDs) is a secret:
#   npx wrangler secret put ADMIN_IDS
# Send /myid to the bot to find yours. Until it's set, nobody has admin commands.

[[d1_databases]]
binding = "DB"
database_name = "prank-week"
# Replace with the id printed by `npx wrangler d1 create prank-week`.
database_id = "REPLACE_WITH_prank-week_ID"
